[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asera-core"
version = "0.2.0"
description = "A modular, high-performance multi-agent orchestration framework with Gemini 2.0 integration and recursive context management (RLM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Black-fox17", email = "ayeleru1234@gmail.com" }
]
keywords = [
    "agents",
    "multi-agent",
    "supervisor",
    "gemini",
    "llm",
    "rlm",
    "recursive-language-models",
    "context-management",
    "orchestration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0"
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.28.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]

[project.urls]
Homepage = "https://github.com/Black-fox17/asera-core"
Repository = "https://github.com/Black-fox17/asera-core.git"
Issues = "https://github.com/Black-fox17/asera-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["asera"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
